// Messages used by grpcproc's own tests and benchmarks.
syntax = "proto3";

package grpcproc.test.v1;

option go_package = "github.com/floatdrop/grpcproc/internal/testpb;testpb";

message Ping {
  int64 n = 1;
}

message Pong {
  int64 n = 1;
}

// Order is a one-contract-per-process message: a typed process accepts
// *testpb.Order and switches on Kind.
message Order {
  oneof kind {
    Reserve reserve = 1;
    Cancel cancel = 2;
  }
}

message Reserve {
  string id = 1;
}

message Cancel {
  string id = 1;
}

message Reserved {
  string id = 1;
}

// Command tells a process of FuzzScenario what to do next. The process does
// it on its own goroutine, so that everything it sends is sent by it, in
// order with the rest of what it does, its exit included.
message Command {
  enum Op {
    OP_UNSPECIFIED = 0;
    // Send Ping{n} to the target.
    OP_SEND = 1;
    // Call the target with Ping{n}, which answers Pong{n+1}.
    OP_CALL = 2;
    // Monitor the target.
    OP_MONITOR = 3;
    // Link to the target.
    OP_LINK = 4;
    // End, with reason.
    OP_EXIT = 5;
  }
  Op op = 1;
  // The target: a process of the scenario, by its index.
  int64 target = 2;
  int64 n = 3;
  string reason = 4;
}
