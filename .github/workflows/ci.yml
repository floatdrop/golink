name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Coverage (core must stay at 100%)
        run: |
          go test -count=1 -coverprofile=coverage.out -coverpkg=. .
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "core coverage: $total"
          [ "$total" = "100.0%" ] || { go tool cover -func=coverage.out | awk '$3 != "100.0%"'; exit 1; }
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: Lint and regenerate
        run: |
          buf lint
          buf generate
          git diff --exit-code -- '*.pb.go' || (echo "generated code is stale: run buf generate" && exit 1)
