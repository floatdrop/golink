name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    # Every Go module in the repository, one job each: grpcproc itself, cron
    # and leader included; the adapters with dependencies grpcproc does not
    # have; the examples the README and the site embed; and the benchmarks. A module with a cover list must keep each of those
    # packages at 100%.
    name: ${{ matrix.module == '.' && 'grpcproc' || matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: .
            cover: . ./inspect ./actor ./pubsub ./cron ./leader
          - module: otel
            cover: .
          - module: etcd
            cover: .
          - module: tools
            cover: ./client ./dot ./cli ./mcpserver ./web
          - module: examples
          - module: benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        if: matrix.module == '.'
        run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: ${{ matrix.module }}
      # The examples' tests run each program and compare what it prints with
      # its output.txt.
      - name: Test
        if: matrix.module != 'benchmarks'
        run: go test -race -count=1 ./...
      # The benchmarks measure the working tree against other frameworks; CI
      # only checks that they still build and run.
      - name: Compile and run the benchmarks briefly
        if: matrix.module == 'benchmarks'
        run: go test -run '^$' -bench . -benchtime=50ms ./...
      - name: README embeds the current examples
        if: matrix.module == '.'
        run: go run github.com/campoy/embedmd@v1.0.0 -d README.md
      - name: Coverage (must stay at 100%)
        if: matrix.cover
        run: |
          for pkg in ${{ matrix.cover }}; do
            go test -count=1 -coverprofile=coverage.out -coverpkg=$pkg $pkg
            total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
            echo "${{ matrix.module }}/$pkg coverage: $total"
            [ "$total" = "100.0%" ] || { go tool cover -func=coverage.out | awk '$3 != "100.0%"'; exit 1; }
          done
  generate:
    name: generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: Lint and regenerate
        run: |
          buf lint
          buf generate
          git diff --exit-code -- '*.pb.go' || (echo "generated code is stale: run buf generate" && exit 1)
