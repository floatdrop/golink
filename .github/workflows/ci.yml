name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - name: Test
        run: go test -race -count=1 ./...
      - name: Coverage (golink, inspect and actor must stay at 100%)
        run: |
          for pkg in . ./inspect ./actor; do
            go test -count=1 -coverprofile=coverage.out -coverpkg=$pkg $pkg
            total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
            echo "$pkg coverage: $total"
            [ "$total" = "100.0%" ] || { go tool cover -func=coverage.out | awk '$3 != "100.0%"'; exit 1; }
          done
  otel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: otel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: otel/go.sum
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: otel
      - name: Test
        run: go test -race -count=1 ./...
      - name: Coverage (must stay at 100%)
        run: |
          go test -count=1 -coverprofile=coverage.out .
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "otel coverage: $total"
          [ "$total" = "100.0%" ] || { go tool cover -func=coverage.out | awk '$3 != "100.0%"'; exit 1; }
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: Lint and regenerate
        run: |
          buf lint
          buf generate
          git diff --exit-code -- '*.pb.go' || (echo "generated code is stale: run buf generate" && exit 1)
