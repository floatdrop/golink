name: Site

# The guide under site/, a React project prerendered to static HTML and
# deployed to GitHub Pages. Its code blocks are the files of examples/guide,
# imported at build time, so a change there rebuilds the site, and the Go CI
# is what keeps them compiling and their pinned output true.
#
# Node 24 is a floor, not a preference: the build and prerender scripts are
# TypeScript run straight by node, which needs its type stripping.

on:
  push:
    branches: [main]
    paths: [site/**, examples/guide/**, .github/workflows/pages.yml]
  pull_request:
    paths: [site/**, examples/guide/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The page shows the guide's code and what its tests pin: they pass
      # before it is built, as well as in the Go CI.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: examples/go.sum
      - name: guide tests
        working-directory: examples
        run: go test -count=1 ./guide/...
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run check
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          BASE_PATH: /grpcproc
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # One deploy at a time, and never cancelled halfway. Only this job
    # queues, so a pull request's build cannot hold up a deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
