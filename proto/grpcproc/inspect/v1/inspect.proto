// grpcproc.inspect.v1 is the inspection surface of a grpcproc node: what
// processes exist, what is in their mailboxes, what each says about itself,
// what is happening on its links. Every tool (CLI, UI, MCP server) is a
// client of this service.
syntax = "proto3";

package grpcproc.inspect.v1;

import "grpcproc/v1/grpcproc.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/floatdrop/grpcproc/proto/grpcproc/inspect/v1;inspectv1";

// Inspector is registered by the application next to grpcproc.v1.Node.
//
// Every request names the node it is about. An empty node, or this node's
// own name, is answered here; any other name is forwarded to that node's
// Inspector when the server was built to reach other nodes, so one endpoint
// can inspect the whole cluster.
service Inspector {
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  // GetProcess returns a snapshot and, if asked, what the process publishes
  // about itself (WithInspect), produced on its own goroutine.
  rpc GetProcess(GetProcessRequest) returns (GetProcessResponse);
  rpc SetLogLevel(SetLogLevelRequest) returns (SetLogLevelResponse);
  rpc Send(SendRequest) returns (SendResponse);
  rpc Exit(ExitRequest) returns (ExitResponse);
  // Watch streams events until the client cancels.
  rpc Watch(WatchRequest) returns (stream WatchResponse);
}

message NodeID {
  string name = 1;
  uint64 incarnation = 2;
}

enum LinkState {
  LINK_STATE_UNSPECIFIED = 0;
  LINK_STATE_CONNECTING = 1;
  LINK_STATE_UP = 2;
  LINK_STATE_DOWN = 3;
}

message Link {
  NodeID peer = 1;
  bool outbound = 2;
  LinkState state = 3;
  google.protobuf.Timestamp established_at = 4;
  uint64 reconnects = 5;
  uint64 messages = 6;
  uint64 bytes = 7;
  string last_error = 8;
  // Set on an outbound link that is down because dials to the peer failed:
  // sends to it fail at once until then (Config.DialBackoff).
  google.protobuf.Timestamp retry_at = 9;
  // Outbound: envelopes waiting to be written.
  uint32 queued = 10;
}

message NodeInfo {
  NodeID id = 1;
  string advertise = 2;
  google.protobuf.Timestamp started_at = 3;
  uint32 processes = 4;
  uint64 spawned = 5;
  uint64 exited = 6;
  uint64 dead_letters = 7;
  repeated Link links = 8;
}

enum ProcessState {
  PROCESS_STATE_UNSPECIFIED = 0;
  PROCESS_STATE_IDLE = 1;
  PROCESS_STATE_RUNNING = 2;
  PROCESS_STATE_WAITING_REPLY = 3;
  PROCESS_STATE_EXITING = 4;
}

message Mailbox {
  uint32 depth = 1;
  uint32 peak = 2;
  google.protobuf.Duration oldest_age = 3;
}

message ProcessInfo {
  grpcproc.v1.PID pid = 1;
  // Registered with WithName; empty for an unnamed process.
  string name = 2;
  string label = 3;
  string type = 4;
  grpcproc.v1.PID parent = 5;
  ProcessState state = 6;
  google.protobuf.Timestamp started_at = 7;
  Mailbox mailbox = 8;
  uint64 received = 9;
  uint64 sent = 10;
  uint32 calls_in_flight = 11;
  string last_message = 12;
  uint32 monitors = 13;
  uint32 watchers = 14;
  uint64 wakeups = 15;
  // slog.Level: -4 debug, 0 info, 4 warn, 8 error.
  sint32 log_level = 16;
}

// Target names a process by pid or by name, on the request's node.
message Target {
  oneof kind {
    grpcproc.v1.PID pid = 1;
    string name = 2;
  }
}

message GetNodeRequest {
  string node = 1;
}

message GetNodeResponse {
  NodeInfo node = 1;
}

// ListProcessesRequest filters are ANDed; empty fields match everything.
message ListProcessesRequest {
  string node = 1;
  // Substring of the process's name; a process with none matches only an
  // empty filter.
  string name = 2;
  // Exact label.
  string label = 3;
  ProcessState state = 4;
  // Only processes whose mailbox holds at least this many messages.
  uint32 min_mailbox = 5;
}

message ListProcessesResponse {
  repeated ProcessInfo processes = 1;
}

message GetProcessRequest {
  string node = 1;
  Target target = 2;
  // Ask the process what it believes (WithInspect).
  bool inspect = 3;
  // How long to wait for a busy process to answer. Default 1s.
  google.protobuf.Duration inspect_timeout = 4;
}

message GetProcessResponse {
  ProcessInfo process = 1;
  map<string, string> inspect = 2;
  // Why inspect is empty when it was asked for: the process was busy, or
  // exited in the meantime.
  string inspect_error = 3;
}

message SetLogLevelRequest {
  string node = 1;
  Target target = 2;
  sint32 level = 3;
}

message SetLogLevelResponse {}

message SendRequest {
  string node = 1;
  Target target = 2;
  google.protobuf.Any body = 3;
}

message SendResponse {}

message ExitRequest {
  string node = 1;
  Target target = 2;
  string reason = 3;
}

message ExitResponse {}

message WatchRequest {
  string node = 1;
  // Events buffered for this watcher; beyond it events are dropped and
  // counted in Event.missed. Default 256.
  uint32 buffer = 2;
}

message WatchResponse {
  Event event = 1;
}

message Event {
  google.protobuf.Timestamp time = 1;
  // Events this watcher lost since the previous one.
  uint64 missed = 2;
  oneof kind {
    ProcessInfo spawned = 3;
    Exited exited = 4;
    NodeID link_up = 5;
    LinkDown link_down = 6;
    DeadLetter dead_letter = 7;
  }
}

message Exited {
  ProcessInfo process = 1;
  string reason = 2;
}

message LinkDown {
  NodeID peer = 1;
  string error = 2;
}

message DeadLetter {
  grpcproc.v1.PID from = 1;
  grpcproc.v1.PID to = 2;
  // Proto full name of the message.
  string type = 3;
  string reason = 4;
}
