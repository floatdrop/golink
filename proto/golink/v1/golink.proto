// golink.v1 is the wire protocol between golink nodes. One stream per
// (sender node -> receiver node) direction carries every interaction between
// the two, in order: messages, calls, replies, monitors and down notifications.
syntax = "proto3";

package golink.v1;

option go_package = "github.com/floatdrop/golink/proto/golink/v1;golinkv1";

// Node is registered by a node on the application's gRPC server.
service Node {
  // Link is opened by the sending node. The client sends its identity in the
  // request metadata (golink-node, golink-incarnation, golink-version); the
  // server answers with one Frame holding a Hello and then only reads.
  // Application envelopes flow client -> server only.
  rpc Link(stream Frame) returns (stream Frame);
}

// Frame is what a link writes at once: every envelope queued since its last
// write, in order. Under load many envelopes share one gRPC message.
message Frame {
  repeated Envelope envelopes = 1;
}

// PID identifies a process anywhere in the cluster.
message PID {
  string node = 1;
  // Incarnation changes every time a node starts, so a PID from before a
  // restart never reaches a process created after it.
  uint64 incarnation = 2;
  uint64 id = 3;
}

// Envelope is one interaction between two processes. Its processes are
// named by incarnation and id alone: the sender is on the node that opened
// the link, the target on the node that accepted it, so neither node name
// travels with each envelope. It is one flat message so that decoding one
// allocates little.
message Envelope {
  Kind kind = 1;
  // The process on the sending node; id 0 is the node itself.
  uint64 from_incarnation = 2;
  uint64 from_id = 3;
  // The process on the receiving node, unless to_name addresses it by name.
  uint64 to_incarnation = 4;
  uint64 to_id = 5;
  string to_name = 6;
  // A call's id, echoed by its reply, or a monitor's id, echoed by its down.
  uint64 ref = 7;
  // A reply's status.
  Status status = 8;
  // A reply's error, or the reason of a down or an exit.
  string reason = 9;
  // The body of a send, a call or a reply: its message type's full name and
  // its encoding.
  string body_type = 10;
  bytes body = 11;
  Hello hello = 12;
  // Propagated context: trace headers, tenant, deadline. Never interpreted by
  // golink itself.
  map<string, string> metadata = 15;
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  // The first envelope on a stream, sent by the server.
  KIND_HELLO = 1;
  // An asynchronous message.
  KIND_SEND = 2;
  // A request that expects a KIND_REPLY with the same ref.
  KIND_CALL = 3;
  KIND_REPLY = 4;
  // Asks the target's node to send KIND_DOWN when the target exits.
  KIND_MONITOR = 5;
  KIND_DEMONITOR = 6;
  // Tells the target that the sender exited.
  KIND_DOWN = 7;
  // Asks the target to terminate.
  KIND_EXIT = 8;
}

// Hello is the first envelope on a stream, sent by the server. It names the
// node the client actually reached.
message Hello {
  string node = 1;
  uint64 incarnation = 2;
  uint32 version = 3;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  // The handler returned an error; reason carries its text.
  STATUS_ERROR = 2;
  // No such process, or it exited before answering.
  STATUS_NOPROC = 3;
  // The process exists but does not accept this message type.
  STATUS_TYPE = 4;
}

