version: "2"

linters:
  default: standard
  enable:
    - revive
  settings:
    revive:
      # Only these two rules, not revive's default set: they catch the
      # parameters and receivers the standard linters do not look at.
      rules:
        - name: unused-receiver
        - name: unused-parameter
  exclusions:
    generated: strict
    rules:
      # Hooks, process functions and test doubles have signatures fixed by an
      # interface or the API; one that ignores a parameter can only rename it
      # to _. Tests are full of them.
      - linters: [revive]
        path: _test\.go

# An unused receiver and an unused parameter sit on the same signature line,
# and only one issue per line is reported by default, which would hide the
# second until the first was fixed.
issues:
  uniq-by-line: false
